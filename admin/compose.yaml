services:
  galene-admin:
    build: .
    image: galene-admin
    container_name: galene-admin
    restart: unless-stopped
    ports:
      # Docker-published ports bypass host firewalls such as ufw, so in
      # LAN mode the app also checks client addresses (ADMIN_GUI_SUBNETS).
      - "${ADMIN_GUI_LISTEN:-0.0.0.0}:${ADMIN_GUI_PORT:-8444}:8444"
    environment:
      ADMIN_GUI_MODE: ${ADMIN_GUI_MODE:-lan}
      ADMIN_GUI_SUBNETS: ${ADMIN_GUI_SUBNETS:-}
      ADMIN_GUI_HOSTS: ${ADMIN_GUI_HOSTS:-}
      ADMIN_GUI_PATH: ${ADMIN_GUI_PATH:-}
      GALENE_CONTAINER: ${GALENE_CONTAINER:-galene}
    volumes:
      # Runs galenectl in the Galene container and starts/stops it.  This
      # gives the container full control over Docker on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: admin password hash, canonicalHost, certificate, tokens.
      - ../data:/galene/data:ro
      # Read-only: group files, to display users and settings.
      - ../groups:/galene/groups:ro
